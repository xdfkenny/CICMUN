name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    # ubuntu-latest now resolves to 26.04, which Playwright 1.58 does not
    # support for Chromium; pin to 24.04 until Playwright catches up.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Playwright smoke tests
        run: npm run test:e2e
