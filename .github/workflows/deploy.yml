name: Deploy to FTP

# Runs after the "CI" workflow finishes successfully on main, or manually
# from the Actions tab. The static site (`.output/public`) is mirrored to the
# FTP host's public_html/ directory.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      remote_dir:
        description: "Override remote directory (blank = FTP_REMOTE_DIR)"
        required: false
        default: ""
      probe_only:
        description: "Only inspect the remote, do not upload"
        required: false
        default: "false"
      no_delete:
        description: "Upload without deleting remote-only files"
        required: false
        default: "false"

# Never run two deploys at once; queue the next one behind a running deploy.
concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

env:
  FTP_HOST: ftp.cicmun.cic-caracas.com
  # ftp | ftps (explicit TLS) | sftp
  FTP_PROTOCOL: ftps
  # 21 for ftp/ftps, 22 for sftp
  FTP_PORT: "21"
  # The domain's document root is the account root (parent of the FTP home's
  # public_html). ".." uploads the site to that served root; a literal
  # "public_html/" target nests a duplicate and is never served.
  FTP_REMOTE_DIR: ..
  # Never delete at the account root: it also holds public_html/ and
  # default.php, which must be preserved. Set "true" only with care.
  FTP_DELETE: "false"
  SITE_DIR: .output/public

jobs:
  deploy:
    # Only deploy a successful push to main (not pull_request runs), or a
    # manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated, not the moving branch head.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        # `pregenerate` hook runs the asset generators (images, gallery, sitemap)
        # before `nuxt generate` emits the static site into .output/public.
        run: npm run generate

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Inspect remote layout (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          run() {
            lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_HOST:$FTP_PORT" -e "
              set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false;
              set cmd:fail-exit no;
              $1 ;
              bye
            " || true
          }
          clean() { sed -E 's#ftp://[^/]*@#ftp://#'; }

          echo '=== pwd ===';        run 'pwd' | clean
          echo '=== cwd listing ==='; run 'cls -1'
          echo '=== .htaccess ===';  run 'cat .htaccess'
          echo '=== placeholder files ==='; run 'cls -1 index.php default.php index.html'
          echo '=== parent ===';     run 'cd ..; pwd' | clean
          echo '=== parent listing ==='; run 'cd ..; cls -1'

      - name: Deploy to FTP
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.probe_only != 'true' }}
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR_INPUT: ${{ github.event.inputs.remote_dir }}
          NO_DELETE_INPUT: ${{ github.event.inputs.no_delete }}
        run: |
          set -euo pipefail

          TARGET_DIR="${REMOTE_DIR_INPUT:-$FTP_REMOTE_DIR}"
          DELETE_FLAG=""
          if [ "${FTP_DELETE:-false}" = "true" ] && [ "${NO_DELETE_INPUT:-false}" != "true" ]; then
            DELETE_FLAG="--delete"
          fi
          echo "Uploading to: $TARGET_DIR (delete flag: '${DELETE_FLAG}')"

          if [ -z "${FTP_USERNAME:-}" ] || [ -z "${FTP_PASSWORD:-}" ]; then
            echo "::error::FTP_USERNAME and FTP_PASSWORD must be added as repository secrets."
            exit 1
          fi

          if [ ! -d "$SITE_DIR" ]; then
            echo "::error::$SITE_DIR was not produced by the build."
            exit 1
          fi

          # lftp's ftps:// scheme performs *implicit* TLS, but Hostinger on
          # port 21 speaks *explicit* FTPS (AUTH TLS). Use ftp:// with
          # ssl-force so lftp negotiates explicit TLS.
          SSL_OPTS=""
          case "$FTP_PROTOCOL" in
            ftp)
              URL="ftp://$FTP_HOST:$FTP_PORT"
              ;;
            ftps)
              URL="ftp://$FTP_HOST:$FTP_PORT"
              # The shared host presents its *.hstgr.io certificate, which will
              # not match this hostname. TLS still encrypts the session.
              SSL_OPTS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate false;"
              ;;
            sftp)
              URL="sftp://$FTP_HOST:$FTP_PORT"
              ;;
            *)
              echo "::error::Unknown FTP_PROTOCOL '$FTP_PROTOCOL'"
              exit 1
              ;;
          esac

          # mirror -R  = upload local -> remote
          # --delete   = remove remote files not present locally (excludes protected)
          # --exclude  = never upload or delete server-managed files
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$URL" -e "
            set net:max-retries 3;
            set net:timeout 30;
            $SSL_OPTS
            mirror -R $DELETE_FLAG --no-perms --verbose=1 \
              --exclude-glob .htaccess \
              --exclude-glob .user.ini \
              --exclude-glob .ftpquota \
              --exclude-glob .well-known/* \
              --exclude-glob cgi-bin/* \
              --exclude-glob public_html \
              --exclude-glob default.php \
              "$SITE_DIR/" "$TARGET_DIR";
            bye
          "
